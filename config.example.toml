schema_version = 1
mode = "auto"
template = ' {{ .Tab.Number }}: {{ .Pane.Directory }} > {{ if .Agent.Active }}{{ statusIcon .Agent.Status }} {{ coalesce .Agent.DisplayName .Agent.Kind }}{{ else }}{{ .Process.Name }}{{ end }} '
poll_interval = "2s"
refresh_debounce = "80ms"
max_width = 0

[aliases.process]
zsh = "shell"

[icons.agent_status]
working = "◐"
blocked = "×"
done = "✓"
idle = "○"
unknown = "·"

[[profiles]]
name = "coding-agents"
mode = "auto"
template = ' {{ .Tab.Number }}: {{ .Pane.Directory }} > {{ statusIcon .Agent.Status }} {{ coalesce .Agent.DisplayName .Agent.Name .Agent.Kind }} '
max_width = 36

[profiles.match]
cwd_glob = ["~/Projects/**"]
agent_regex = ["^(codex|claude)$"]

[[profiles]]
name = "manual-logs"
mode = "keybind"
template = ' {{ .Tab.Number }}: logs/{{ .Process.Name }} '

[profiles.match]
process_regex = ["^(tail|less|lnav)$"]

# Tab-bar right edge, rendered by the `status` command. Counts are omitted when zero.
[status]
template = '{{ if .Blocked }}{{ statusIcon "blocked" }}{{ .Blocked }} {{ end }}{{ if .Working }}{{ statusIcon "working" }}{{ .Working }} {{ end }}{{ if .Done }}{{ statusIcon "done" }}{{ .Done }} {{ end }}{{ .Workspace.Label }}'
