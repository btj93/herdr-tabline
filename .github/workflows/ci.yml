name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Both supported platforms are tested. Testing only Linux while the README claims
  # macOS support would make the badge green by not looking.
  test:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # "stable" rather than the go.mod floor of 1.22. Go 1.22 links race-detector
          # binaries that current macOS runners reject at load time with
          # "dyld: missing LC_UUID load command", which aborts every package before a
          # single test runs. go.mod still declares 1.22 as the language floor; this
          # only chooses the toolchain CI builds with.
          go-version: stable
      - run: go version
      - run: make check

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true
      - name: build
        run: |
          echo "building GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}"
          go build -o "bin/herdr-tabline-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/herdr-tabline
      # Artifacts are published only for version tags; branch builds just prove it compiles.
      - name: upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: herdr-tabline-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/herdr-tabline-${{ matrix.goos }}-${{ matrix.goarch }}
