name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true
      - run: make check

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true
      - name: build
        run: |
          echo "building GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}"
          go build -o "bin/herdr-tabline-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/herdr-tabline
      # Artifacts are published only for version tags; branch builds just prove it compiles.
      - name: upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: herdr-tabline-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/herdr-tabline-${{ matrix.goos }}-${{ matrix.goarch }}
